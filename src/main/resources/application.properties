spring.application.name=formula-substitution-engine
server.port=8080

# In-memory H2 database, recreated on every start from schema.sql + data.sql
spring.datasource.url=jdbc:h2:mem:formuladb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Browse the tables at http://localhost:8080/h2-console  (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true
